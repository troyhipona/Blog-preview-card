<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <link rel="stylesheet" href="./style.css">

</head>
<body>
  <main>
    <img class="blog-card__image" src="./assets/images/illustration-article.svg" alt="Web 3.0 illustration">
    <article class="blog-card">
      <p class="blog-card__category">Learning</p>

      <p class="blog-card__date">
        <time datetime="2023-12-21">Published 21 Dec 2023</time>
      </p>

      <h1 class="blog-card__title">HTML &amp; CSS foundations</h1>

      <p class="blog-card__description">
        These languages are the backbone of every website, defining
        structure, content, and presentation.
      </p>

      <footer class="blog-card__author">
        <img class="blog-card__author-image" src="./assets/images/image-avatar.webp" width="32" height="32" alt="Michelle Avatar">
        <p>Greg Hooper</p>
      </footer>
    </article>
  </main>

  <footer class="attribution">
    Challenge by
    <a href="https://www.frontendmentor.io?ref=challenge"
      >Frontend Mentor</a>
    Coded by <a href="https://github.com/troyhipona">Troy Jose</a>
  </footer> 
</body>
</html>
